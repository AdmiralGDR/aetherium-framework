# Aetherium Framework — Gradle runtime configuration.
# EN: Build behaviour knobs. We do NOT auto-download JDKs: the toolchain must resolve to the
#     locally installed GraalVM 21 so FFM preview features match the runtime exactly.
# RU: Параметры поведения сборки. Мы НЕ скачиваем JDK автоматически: тулчейн обязан
#     разрешаться в локально установленный GraalVM 21, чтобы preview-функции FFM точно
#     совпадали со средой выполнения.

org.gradle.java.installations.auto-download=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Project coordinates (consumed by build scripts; not hardcoded per-module).
aetherium.group=org.aetherium
aetherium.version=1.0.0-SNAPSHOT
