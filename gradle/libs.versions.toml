# Aetherium Framework — centralized dependency catalog.
# EN: Versions live here, never hardcoded inline in module build scripts (anti-hardcoding rule).
# RU: Версии живут здесь и никогда не зашиваются в скриптах сборки модулей (правило отказа от хардкода).

[versions]
# Java/Minecraft platform baseline
java = "21"
neoforge = "21.1.233"         # NeoForge 1.21.1 baseline (compatibility target; locally cached userdev)
minecraft = "1.21.1"
moddevgradle = "2.0.141"      # NeoForge ModDevGradle plugin (locally cached)

# Bytecode engine
asm = "9.8"                    # OW2 ASM (cached locally; offline-capable)

# Boot-layer APIs the transformer compiles against but NEVER bundles (provided by the ModLauncher
# boot layer at runtime — see aetherium-transformer). Versions pinned to the NeoForge 21.1.x baseline.
modlauncher = "11.0.5"         # cpw.mods:modlauncher — ITransformationService / ILaunchPluginService
slf4j = "2.0.9"                # org.slf4j:slf4j-api — logging facade (NeoForge provides the impl)
fabricloader = "0.16.10"       # net.fabricmc:fabric-loader — ModInitializer (compileOnly in aetherium-fabric)

# Kotlin DSL module (aetherium-ktx) — zero-overhead inline wrappers, no runtime reflection
kotlin = "2.1.20"              # Kotlin JVM (Plugin Portal + mavenCentral); 2.1+ for -Xjvm-enable-preview

# Testing (wired in a later phase)
junit = "5.10.2"

[libraries]
asm-core      = { module = "org.ow2.asm:asm",          version.ref = "asm" }
asm-tree      = { module = "org.ow2.asm:asm-tree",      version.ref = "asm" }
asm-commons   = { module = "org.ow2.asm:asm-commons",   version.ref = "asm" }
asm-util      = { module = "org.ow2.asm:asm-util",      version.ref = "asm" }
asm-analysis  = { module = "org.ow2.asm:asm-analysis",  version.ref = "asm" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# ModLauncher boot-layer APIs — compileOnly in aetherium-transformer (never shipped in its jar).
modlauncher   = { module = "cpw.mods:modlauncher",   version.ref = "modlauncher" }
slf4j-api     = { module = "org.slf4j:slf4j-api",     version.ref = "slf4j" }
# Fabric entrypoint interfaces (ModInitializer) — compileOnly in aetherium-fabric, never shipped.
fabricloader  = { module = "net.fabricmc:fabric-loader", version.ref = "fabricloader" }

[bundles]
# The full ASM surface the bytecode engine needs: reader/writer + tree API + helpers + verifier.
asm = ["asm-core", "asm-tree", "asm-commons", "asm-util", "asm-analysis"]

[plugins]
# NeoForge ModDevGradle — applied ONLY in aetherium-loader (the sole game-integration module).
moddev = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
# Kotlin JVM — applied ONLY in aetherium-ktx (the DSL module).
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
